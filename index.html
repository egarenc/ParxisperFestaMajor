<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PARXÍS PER FESTA MAJOR</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/x-icon" href="ico_parxis.ico">
</head>
<body>
  <main class="app-shell">
    <section class="welcome-panel" id="welcomePanel">
      <div class="welcome-content">
        <!-- 🍿 Envoltura de marquesina con efecto blur -->
        <div class="welcome-marquee">
          <h1>Partideta al PARXÍS<br>per Festa Major</h1>
        </div>
        <div class="welcome-actions">
          <button id="feedbackButton" type="button" class="secondary">FEEDBACK</button>
          <button id="continueButton" type="button" class="primary">CONTINUAR</button>
        </div>
      </div>
    </section>

    <section class="selection-panel hidden" id="selectionPanel">
      <div class="selection-marquee">
      <h2>Tria una COLLA per cada jugador</h2>
      
<div class="player-input-row">
  <div class="player-label-zone">
    <span class="file-label">Jugador <span class="text-color-red">VERMELL</span></span>
    <label class="switch">
      <input type="checkbox" id="cpuToggle-red">
      <span class="slider-switch"><span class="cpu-inside-text">CPU</span></span>
    </label>
  </div>
  <button id="btnImageRed" type="button" class="secondary select-image-btn">Escollir Imatge</button>
</div>
<div class="player-input-row">
  <div class="player-label-zone">
    <span class="file-label">Jugador <span class="text-color-green">VERD</span></span>
    <label class="switch">
      <input type="checkbox" id="cpuToggle-green">
      <span class="slider-switch"><span class="cpu-inside-text">CPU</span></span>
    </label>
  </div>
  <button id="btnImageGreen" type="button" class="secondary select-image-btn">Escollir Imatge</button>
</div>
<div class="player-input-row">
  <div class="player-label-zone">
    <span class="file-label">Jugador <span class="text-color-yellow">GROC</span></span>
    <label class="switch">
      <input type="checkbox" id="cpuToggle-yellow">
      <span class="slider-switch"><span class="cpu-inside-text">CPU</span></span>
    </label>
  </div>
  <button id="btnImageYellow" type="button" class="secondary select-image-btn">Escollir Imatge</button>
</div>
<div class="player-input-row">
  <div class="player-label-zone">
    <span class="file-label">Jugador <span class="text-color-blue">BLAU</span></span>
    <label class="switch">
      <input type="checkbox" id="cpuToggle-blue">
      <span class="slider-switch"><span class="cpu-inside-text">CPU</span></span>
    </label>
  </div>
  <button id="btnImageBlue" type="button" class="secondary select-image-btn">Escollir Imatge</button>
</div>

<!-- Reemplaza el bloque "dice-duration-setting" por este: -->
<div class="dice-duration-setting" style="margin-top: 24px; text-align: center; width: 100%; max-width: 400px; margin-left: auto; margin-right: auto;">
  <label for="diceDurationSlider" style="display: block; font-weight: bold; margin-bottom: 12px;">
    Temps de tirada del dau: <span id="diceDurationValue">3</span> segons
  </label>
  
  <div style="display: flex; align-items: center; justify-content: center; gap: 15px; font-weight: bold;">
    <span>1</span>
    
    <!-- Contenedor común acortado para sincronía total -->
    <div class="slider-wrapper" style="width: 60%; position: relative; display: flex; flex-direction: column; align-items: center;">
      
      <input 
        type="range" 
        id="diceDurationSlider" 
        min="1" 
        max="5" 
        step="1" 
        value="3" 
        style="width: 100%; cursor: pointer; margin: 0; z-index: 2;" 
      >
      
      <!-- ─── MARCAS MANUALES EN LUGAR DE DATALIST ─── -->
      <div class="slider-marks">
        <span class="mark"></span>
        <span class="mark"></span>
        <span class="mark"></span>
        <span class="mark"></span>
        <span class="mark"></span>
      </div>
      
    </div>
    
    <span>5</span>
  </div>
</div>
<!-- 🔊 CONFIGURACIÓN DE SONIDO PRINCIPAL (MUTE ON/OFF) -->
<div class="sound-setting" style="margin-top: 24px; text-align: center; width: 100%; max-width: 400px; margin-left: auto; margin-right: auto;">
  <!-- <span style="display: block; font-weight: bold; margin-bottom: 12px;">Efectos de sonido:</span>-->
  <button type="button" id="toggleSoundButton" class="secondary" style="width: 60%; padding: 10px 20px; text-transform: uppercase; font-size: 0.9rem; display: inline-flex; align-items: center; justify-content: center; gap: 8px;">
    <span id="soundIcon">🔊</span> <span id="soundStatusText">SO ACTIU</span>
  </button>
</div>
      </div>
    </div>
      <div class="selection-actions">
        <button id="backButton" type="button" class="secondary">TORNAR</button>
        <button id="startButton" type="button" class="primary">INICIAR PARTIDA</button>
      </div>
      <div id="selectionStatus" class="status-panel hidden"></div>
    </section>

    <section class="gallery-panel hidden" id="galleryPanel">
      <div class="selection-marquee" style="text-align: center;" >
      <h2>TRIA LA TEVA FITXA</h2>
      <div id="galleryGrid" class="gallery-grid"></div>
      <div class="selection-actions" style="margin-top: 24px;">
      <button id="closeGalleryBtn" type="button" class="secondary">CANCEL·LAR</button>
      </div>
      </div>
    </section>
    <section class="board-panel hidden" id="boardPanel">
      <div class="board-screen">
        <div id="statusPanel" class="status-panel"></div>
        <div class="board-stage" id="boardStage" aria-label="Tablero de parchís"></div>
      </div>
      <div class="game-actions-footer" style="text-align: center; margin-top: 20px; width: 100%; padding-bottom: 20px;">
        <button type="button" id="exitGameButton" style="background-color: #dc2626; color: #ffffff; padding: 12px 28px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; text-transform: uppercase; font-size: 0.95rem; box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: background-color 0.2s, transform 0.2s;">
          Sortir
        </button>
      </div>
      <div class="dice-overlay hidden" id="diceOverlay">
        <div class="dice-dialog">
          <div class="dice-controls">
            <button id="rollDiceButton" type="button">LLANÇAR DAU</button>
            <div id="diceFace" class="dice-face hidden" aria-label="Cara del dado"></div>
          </div>
          <div id="diceResult" class="dice-result hidden"></div>
          <div id="diceOptionGroup" class="action-button-group"></div>
        </div>
      </div>
    </section>
    <!-- 🟢 MODAL NUEVO PARA EL FORMULARIO DE FEEDBACK (ACTUALIZADO CON REMITENTE) -->
    <div id="feedbackModal" class="dice-overlay hidden">
      <div class="dice-dialog" style="height: auto; min-height: 380px; gap: 16px;">
        <h3 style="margin: 0; color: white;">Envia errors o suggerències</h3>
        <form id="feedbackForm" style="width: 100%; display: flex; flex-direction: column; gap: 14px;">
          
          <!-- Nuevo campo Remitente -->
          <div style="display: flex; flex-direction: column; gap: 6px; text-align: left; width: 100%;">
            <label for="feedbackSender" style="color: rgba(255, 255, 255, 0.8); font-size: 0.85rem; font-weight: bold;">Remitent:</label>
            <input id="feedbackSender" type="text" placeholder="El teu nom" maxlength="30" required style="width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: white; font-family: inherit; font-size: 0.95rem;" />
          </div>

          <!-- Campo de Comentarios existente -->
          <div style="display: flex; flex-direction: column; gap: 6px; text-align: left; width: 100%;">
            <label for="feedbackMessage" style="color: rgba(255, 255, 255, 0.8); font-size: 0.85rem; font-weight: bold;">Comentari:</label>
            <textarea id="feedbackMessage" placeholder="Escriu aquí el teu comentari aquí" maxlength="300" required rows="4" style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: white; resize: none; font-family: inherit; font-size: 0.95rem;"></textarea>
          </div>

          <div style="display: flex; gap: 10px; width: 100%; margin-top: 6px;">
            <button id="closeFeedbackButton" type="button" class="secondary" style="flex: 1; padding: 10px;">CANCELAR</button>
            <button id="submitFeedbackButton" type="submit" class="primary" style="flex: 1; padding: 10px;">ENVIAR</button>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px; text-align: left; width: 100%;">
            <label for="feedbackSender" style="color: rgba(255, 255, 255, 0.8); font-size: 0.85rem; font-weight: bold;">Si vols que la teva colla no surti a la galeria o potser trobes a faltar alguna, fes-me arribar el teu comentari. Aquest joc és un entreteniment personal sorgit del meu orgull per la cultura de la ciutat.</label>
          </div>
        </form>
        <div id="feedbackStatus" class="hidden" style="font-weight: bold; margin-top: 10px; font-size: 0.95rem;"></div>
      </div>
    </div>

  </main>

  <script src="game.js"></script>
</body>
</html>
